<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Proyecto educativo de sitio web multipágina modular con Bootstrap y jQuery.">
  <title>Contacto | TechSolutions Perú</title>
  <!-- Bootstrap 5: estilos; requiere Internet para este CDN. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS propio: sobrescribe/personaliza los componentes Bootstrap. -->
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="d-flex flex-column min-vh-100" data-base="../" data-page="contacto">
  <!-- Los componentes se descargan desde /componentes/ con fetch(). -->
  <div id="componente-navbar"></div>
  <main class="flex-grow-1" id="contenido">

    <section class="page-heading py-5"><div class="container"><span class="badge text-bg-info">Hablemos</span><h1 class="fw-bold mt-3">Contáctanos</h1><p class="lead mb-0">Práctica de formularios y validación en el navegador.</p></div></section>
    <section class="container py-5"><div class="row justify-content-center"><div class="col-lg-8">
      <div class="card shadow-sm"><div class="card-body p-4 p-md-5">
        <p class="alert alert-info small" role="note">Formulario académico. No se envían ni guardan datos personales en ningún servidor.</p>
        <form id="formContacto" novalidate>
          <div class="row g-3">
            <div class="col-md-6"><label for="nombre" class="form-label">Nombre completo</label><input class="form-control" id="nombre" name="nombre" type="text" minlength="3" maxlength="80" required><div class="invalid-feedback">Ingresa al menos tres caracteres.</div></div>
            <div class="col-md-6"><label for="correo" class="form-label">Correo electrónico</label><input class="form-control" id="correo" name="correo" type="email" required><div class="invalid-feedback">Ingresa un correo válido.</div></div>
            <div class="col-12"><label for="servicio" class="form-label">Servicio de interés</label><select class="form-select" id="servicio" name="servicio" required><option value="">Selecciona un servicio</option><option value="Desarrollo web">Desarrollo web</option><option value="Consultoría">Consultoría</option><option value="Ciberseguridad">Ciberseguridad</option></select><div class="invalid-feedback">Selecciona una opción.</div></div>
            <div class="col-12"><label for="mensaje" class="form-label">Mensaje</label><textarea class="form-control" id="mensaje" name="mensaje" rows="5" minlength="10" required></textarea><div class="invalid-feedback">Escribe al menos 10 caracteres.</div></div>
          </div>
          <button class="btn btn-primary mt-4" type="submit">Validar y mostrar resumen</button>
          <button class="btn btn-outline-secondary mt-4" type="reset">Limpiar</button>
        </form>
        <div id="resultadoContacto" class="alert alert-success mt-4 d-none" role="status" aria-live="polite"></div>
      </div></div>
    </div></div></section>

  </main>
  <div id="componente-footer"></div>
  <!-- jQuery permite manipular el DOM y escuchar eventos. -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Bootstrap JS (incluye Popper): navbar, carousel y modal. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Código compartido: carga navbar/footer mediante fetch(). -->
  <script src="../js/componentes.js"></script>
  <script src="../js/contacto.js"></script>
</body>
</html>
